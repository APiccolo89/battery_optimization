simulation:
  name : Double_Market_unconstrainedd
  optimization:
    window_days: 1 # Date in [us]
    start_date: 2018/01/01
    end_date: 2019/01/08
    max_cycles: 1e9 # Maximum cycle of the battery 
    charge_min: 0.00 # The minimal energy of the battery that must be retained

 
  battery:
    model_name: bt001 # bt001 
    degradation_model: none # // {options: linear, compound}: 
    initial_cycles: 0 # In the case the battery has been already deployed before the interval  of the simulation. 
    initial_age: 0  # In the case of the battery has been already deployed before the interval of the simulation. 
    initial_charge: 0.5

  # The maximum market per battery is 6 {arbitrary number}. The omitted market are not considered. Potential extension
  # path to metadata of the market. 
  markets:
    market1:
      prices_file: market1.csv # Name of the file
      path_to_file: null # path to the file 
      packaged_data: True # Flag to indicate if the market csv is in the package {fixed location in study_case}
    market2:
      prices_file: market2.csv
      path_to_file: null
      packaged_data: True 
  
  output: 
    path_to_save: null
    basic_plot: True
    default_location: True
    clean_option: True